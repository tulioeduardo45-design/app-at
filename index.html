<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Entre Sessões · AT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root { color-scheme: light; --bg:#F4F3EE; --p:#FFFFFF; --tx:#1C2321; --mu:#5E6662; --mu2:#8A918D; --ln:#E3E1D9; --ln2:#EFEDE6; --campo:#D9D6CC; --neutro:#EAE8E0; --ac:#2C6E6A; --ace:#1F3B38; --acs:#E3EFEC; --acc:#9FD0C6; --recado:#FBF4E6; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --I:#2C6E6A; --G:#4C5BAA; --V:#7A62B0; --FP:#B7791F; --FT:#C0612F; --E:#B4475E; --A:#B7791F; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
h1, h2, h3 { margin:0; letter-spacing:-0.02em; line-height:1.2; }
.mono { font-family:var(--mono); }
.rot { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--mu2); }
.mu { color:var(--mu); font-size:14px; }
main { max-width:560px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
.cab { display:flex; align-items:flex-start; gap:10px; margin:4px 0 18px; }
.cab .tx { flex:1; }
.cab h1 { font-size:28px; }
.sync { font-size:12.5px; font-weight:600; border-radius:20px; padding:5px 11px; background:var(--acs); color:var(--ace); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.sync i { width:7px; height:7px; border-radius:50%; background:var(--ac); display:inline-block; }
.sync.pend { background:#FBF0DC; color:#8A5A12; } .sync.pend i { background:#B7791F; }
.card { background:var(--p); border:1px solid var(--ln); border-radius:18px; padding:16px; margin-bottom:12px; }
.btn { border:1px solid var(--campo); background:var(--p); border-radius:14px; padding:13px 16px; font-weight:700; font-size:15.5px; min-height:48px; }
.btn.pri { background:var(--ac); border-color:var(--ac); color:#fff; }
.btn.neutro { background:var(--neutro); border-color:var(--neutro); }
.btn.bloco { display:block; width:100%; text-align:center; }
.btn.peq { min-height:38px; padding:7px 12px; font-size:14px; border-radius:11px; }
.lnk { border:0; background:none; color:var(--ac); font-weight:700; padding:6px 4px; }
.ag { display:flex; gap:14px; align-items:flex-start; margin-bottom:14px; }
.ag .h { font-family:var(--mono); font-size:19px; font-weight:500; padding-top:2px; }
.ag b { display:block; font-size:18px; }
.pill { display:inline-block; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:20px; }
.st-revisao { color:#8A5A12; background:#FBF0DC; } .st-revisada { color:#1F5C58; background:#E3EFEC; } .st-ajuste { color:#9A3A50; background:#F7E6EA; } .st-nao { color:#5E6662; background:var(--neutro); } .st-and { color:#4C5BAA; background:#E7E9F5; }
.recado { background:var(--recado); border-radius:16px; padding:14px; margin-bottom:10px; }
.recado b { display:block; font-size:14.5px; margin-bottom:4px; }
.recado p { margin:0; font-size:14.5px; white-space:pre-wrap; }
.nav { position:fixed; left:0; right:0; bottom:0; background:var(--p); border-top:1px solid var(--ln); display:flex; justify-content:center; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); z-index:30; }
.nav .in { display:flex; width:100%; max-width:560px; }
.nav button { flex:1; border:0; background:none; padding:10px 4px; font-weight:600; font-size:14.5px; color:var(--mu2); border-radius:12px; }
.nav button.on { color:var(--ace); background:var(--acs); }
.toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%); background:#1C2321; color:#fff; padding:11px 18px; border-radius:14px; font-size:14.5px; z-index:80; max-width:92vw; text-align:center; }
.vazio { text-align:center; padding:28px 12px; color:var(--mu); }
/* coleta */
.col { display:flex; flex-direction:column; min-height:100vh; }
.col-cab { position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 14px 8px; }
.col-cab .nome { flex:1; text-align:center; font-weight:700; font-size:16px; line-height:1.15; }
.col-cab .nome small { display:block; font-family:var(--mono); font-size:15px; font-weight:500; color:var(--mu); }
.col-cab .btn { min-height:40px; padding:7px 12px; font-size:14px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding:4px 14px 10px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--ln); background:var(--p); border-radius:20px; padding:7px 12px; font-size:13.5px; font-weight:600; white-space:nowrap; }
.chip .mono { font-size:12.5px; color:var(--mu); margin-left:4px; }
.chip.on { background:var(--ace); color:#fff; border-color:var(--ace); } .chip.on .mono { color:var(--acc); }
.prog { margin:0 14px; background:var(--p); border:1px solid var(--ln); border-radius:20px; padding:16px; }
.prog .meta { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--mu2); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.prog h2 { font-size:22px; margin:6px 0 2px; }
.prog .alvo { color:var(--mu); font-size:14.5px; }
.prog .pct { display:flex; align-items:baseline; gap:10px; margin:12px 0 8px; }
.prog .pct b { font-family:var(--mono); font-size:44px; font-weight:600; letter-spacing:-0.03em; line-height:1; }
.seq { display:flex; gap:4px; flex-wrap:wrap; min-height:26px; }
.seq span { font-family:var(--mono); font-size:11px; font-weight:600; color:#fff; border-radius:6px; padding:4px 5px; min-width:26px; text-align:center; }
.polegar { position:sticky; bottom:0; margin-top:auto; background:var(--bg); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--ln2); }
.linha3 { display:flex; gap:8px; }
.linha3 button { flex:1; min-height:46px; border-radius:12px; border:1px solid var(--campo); background:var(--p); font-weight:700; font-size:14.5px; }
.grade2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.aj { min-height:62px; border:0; border-radius:14px; color:#fff; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
.aj .n { font-family:var(--mono); font-weight:600; background:rgba(255,255,255,.22); border-radius:10px; padding:2px 9px; font-size:14px; }
.final { display:grid; grid-template-columns:1fr 2fr; gap:8px; }
.final button { height:84px; border:0; border-radius:16px; color:#fff; font-weight:800; font-size:19px; }
button:active { filter:brightness(.92); }
.lista-c { padding:0 14px; }
.lc { background:var(--p); border:1px solid var(--ln); border-radius:18px; padding:14px; margin-bottom:10px; }
.lc .top { display:flex; align-items:baseline; gap:8px; }
.lc .top b { flex:1; font-size:16px; }
.lc .top .mono { font-size:20px; font-weight:600; }
.mini { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-top:10px; }
.mini.tres { grid-template-columns:repeat(3, 1fr); }
.mini button { min-height:52px; border:0; border-radius:12px; color:#fff; font-weight:800; font-size:15px; }
.folha-f { position:fixed; inset:0; background:rgba(28,35,33,.45); z-index:60; display:flex; align-items:flex-end; }
.folha { background:var(--p); width:100%; max-width:560px; margin:0 auto; border-radius:22px 22px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
.comp-l { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--ln2); }
.comp-l:first-of-type { border-top:0; }
.comp-l span { flex:1; font-weight:600; }
.comp-l button { width:52px; height:52px; border-radius:14px; border:1px solid var(--campo); background:var(--p); font-size:24px; font-weight:700; }
.comp-l b { font-family:var(--mono); font-size:22px; min-width:34px; text-align:center; }
.empil { display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--ln2); }
.empil i { display:block; height:100%; }
.res { padding:10px 0; border-top:1px solid var(--ln2); }
.res:first-child { border-top:0; }
.res .t { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; }
.res .t b { flex:1; }
label.cp { display:block; font-weight:600; font-size:14px; margin:12px 0 6px; }
textarea, input[type=text] { width:100%; border:1px solid var(--campo); background:#fff; border-radius:12px; padding:11px 12px; }
textarea { min-height:90px; resize:vertical; }
.leg { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--mu); margin:8px 0; }
.leg span { display:inline-flex; gap:5px; align-items:center; } .leg i { width:9px; height:9px; border-radius:3px; display:inline-block; }
/* gravação (componente compartilhado) */
.grav { border:1px solid var(--ln); border-radius:16px; padding:12px; background:#fff; }
.grav.ativa { background:#FBF1F3; border-color:#ECCBD3; }
.grav-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.grav-ponto { width:10px; height:10px; border-radius:50%; background:#B4475E; animation:pulso 1.2s infinite; }
@keyframes pulso { 50% { opacity:.25; } }
.grav-tempo { font-family:var(--mono); font-size:20px; font-weight:600; }
.onda { display:flex; gap:3px; align-items:center; height:24px; flex:1; min-width:60px; }
.onda i { width:3px; border-radius:2px; background:#B4475E; height:20%; }
.grav.ativa .onda i { animation:onda .9s ease-in-out infinite; }
@keyframes onda { 0%,100% { height:20%; } 50% { height:100%; } }
.grav .btn { min-height:40px; padding:7px 12px; font-size:14px; }
.transc { margin-top:8px; font-size:14px; } .transc p { margin:4px 0; } .transc .ts { font-family:var(--mono); color:var(--mu2); font-size:12px; margin-right:6px; } .transc .parcial { color:var(--mu2); font-style:italic; }
.sub { color:var(--mu); font-size:13.5px; }
.doc { background:#fff; border:1px solid var(--ln); border-radius:18px; padding:20px; }
.doc .lin { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--ln2); font-size:14.5px; }
.barra { height:8px; border-radius:6px; background:var(--ln2); overflow:hidden; } .barra i { display:block; height:100%; background:var(--ac); }
@media print { .nav, .nao-imp { display:none !important; } body, html { background:#fff; } main { padding:0; } .doc { border:0; padding:0; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="extra"></div>
<input type="file" id="arq" accept=".json,application/json,text/plain,*/*" hidden>
<script src="gravador.js"></script>
<script>
(function () {
  'use strict';
  const K = 'es_at_v3';
  const N5 = [{ k: 'G', n: 'Gestual' }, { k: 'V', n: 'Verbal' }, { k: 'FP', n: 'Física parcial' }, { k: 'FT', n: 'Física total' }];
  const NOME = { I: 'Independente', G: 'Gestual', V: 'Verbal', FP: 'Física parcial', FT: 'Física total', E: 'Erro', A: 'Com ajuda' };
  const SIG = { I: 'I', G: 'G', V: 'V', FP: 'FP', FT: 'FT', E: 'E', A: 'A' };
  const FASE = { linha_base: 'Linha de base', intervencao: 'Intervenção', manutencao: 'Manutenção', generalizacao: 'Generalização' };
  const SEC_AT = [{ titulo: 'Relato da sessão' }, { titulo: 'Respostas e desempenho', chaves: ['conseguiu', 'acert', 'respond', 'sozinho', 'independ', 'ajuda', 'dificuldade', 'errou'] }, { titulo: 'Comportamentos e manejo', chaves: ['chor', 'birra', 'agress', 'fuga', 'bateu', 'gritou', 'estereotip', 'comportamento', 'recusou'] }, { titulo: 'Observações para a supervisão', chaves: ['observ', 'sugiro', 'precis', 'dúvida', 'duvida', 'percebi', 'notei'] }];
  const app = document.getElementById('app'), extra = document.getElementById('extra');
  const ui = { aba: 'hoje', prog: 0, folha: null };
  let S;

  /* ---------- dados ---------- */
  function carregar() { try { S = JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { S = null; } S = S || { pacote: null, sessoes: [], formacoes: {} }; }
  function salvar() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) { toast('Memória do navegador cheia. Envie os registros.'); } }
  carregar(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const p2 = n => String(n).padStart(2, '0');
  const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  const hora = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  const dm = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
  const mmss = s => p2(Math.floor(s / 60)) + ':' + p2(Math.floor(s % 60));
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
  const vib = ms => { try { navigator.userActivation && navigator.userActivation.hasBeenActive && navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const P = () => S.pacote;
  const tres = () => P() && P().config && P().config.niveisAjuda === '3';
  const apr = id => P() && P().aprendizes.find(a => a.id === id);
  const sessao = id => S.sessoes.find(s => s.id === id);
  const aberta = () => S.sessoes.find(s => s.estado !== 'finalizada');
  const resumo = t => { const c = {}; t.forEach(x => { c[x.r] = (c[x.r] || 0) + 1; }); const n = t.length; return { n, c, pct: n ? Math.round((c.I || 0) / n * 100) : null }; };
  const media = s => { const v = Object.values(s.resultados).map(r => resumo(r.tentativas).pct).filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const pendentes = () => S.sessoes.filter(s => s.estado === 'finalizada' && (!s.exportadoEm || s.atualizadoEm > s.exportadoEm));
  function statusRemoto(s) { const r = P() && (P().sessoesStatus || []).find(x => x.id === s.id); return r || null; }
  function status(s) {
    if (s.estado !== 'finalizada') return ['Em andamento', 'st-and'];
    const r = statusRemoto(s);
    const reenviadaDepois = s.exportadoEm && s.exportadoEm > (P().geradoEm || '') && s.atualizadoEm <= s.exportadoEm; // corrigida e enviada depois do pacote
    if (r && r.status === 'ajuste' && !reenviadaDepois) return s.atualizadoEm > (s.exportadoEm || '') ? ['Correção não enviada', 'st-nao'] : ['Ajuste solicitado', 'st-ajuste'];
    if (!s.exportadoEm || s.atualizadoEm > s.exportadoEm) return ['Não enviada', 'st-nao'];
    if (r && r.status === 'revisada' && !reenviadaDepois) return ['Revisada', 'st-revisada'];
    return ['Aguardando revisão', 'st-revisao'];
  }
  function empil(c, n) { return n ? `<div class="empil">${['I', 'G', 'V', 'A', 'FP', 'FT', 'E'].filter(k => c[k]).map(k => `<i style="width:${c[k] / n * 100}%;background:var(--${k})"></i>`).join('')}</div>` : '<div class="empil"></div>'; }
  const legenda = () => `<div class="leg">${(tres() ? ['I', 'A', 'E'] : ['I', 'G', 'V', 'FP', 'FT', 'E']).map(k => `<span><i style="background:var(--${k})"></i>${NOME[k]}</span>`).join('')}</div>`;

  /* ---------- rotas ---------- */
  const rota = () => location.hash.replace(/^#\/?/, '').split('/');
  const ir = h => { if (location.hash === '#/' + h) render(); else location.hash = '#/' + h; };
  window.addEventListener('hashchange', () => { ui.folha = null; render(); });

  /* ---------- Hoje ---------- */
  function telaHoje() {
    const pk = P(); const pend = pendentes().length;
    const d = new Date(); const dataL = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    let h = `<div class="cab"><div class="tx"><div class="mu" style="text-transform:capitalize">${dataL}</div><h1>Olá${pk ? ', ' + esc(pk.at.nome.split(' ')[0]) : ''}</h1></div><span class="sync${pend ? ' pend' : ''}"><i></i>${pend ? pend + ' para enviar' : 'Sincronizado'}</span></div>`;
    if (!pk) return h + `<div class="card vazio"><b style="color:var(--tx);font-size:17px">Bem-vindo(a) ao Entre Sessões</b><p>Abra o pacote que a supervisão enviou (arquivo .json) para ver sua agenda e seus aprendizes.</p><button class="btn pri bloco" data-a="abrir-pacote">Abrir pacote</button></div>`;
    const ab = aberta();
    if (ab) h += `<div class="card" style="border-color:var(--ac)"><div class="rot">Sessão em andamento</div><div style="font-size:18px;font-weight:700;margin:4px 0 10px">${esc((apr(ab.aprendizId) || {}).nome || '')} · desde ${ab.inicio}</div><button class="btn pri bloco" data-a="continuar" data-s="${ab.id}">Continuar sessão</button></div>`;
    const wd = d.getDay();
    let ag = (pk.agenda || []).filter(g => +g.dia === wd).sort((a, b) => a.hora.localeCompare(b.hora));
    const titulo = ag.length ? 'Agenda de hoje' : 'Seus aprendizes';
    if (!ag.length) ag = pk.aprendizes.map(a => ({ hora: '', aprendizId: a.id, local: '' }));
    h += `<div class="rot" style="margin:18px 0 10px">${titulo}</div>`;
    h += ag.map(g => {
      const a = apr(g.aprendizId); if (!a) return '';
      const feita = S.sessoes.find(s => s.aprendizId === a.id && s.data === hoje() && s.estado === 'finalizada');
      return `<div class="card"><div class="ag">${g.hora ? `<span class="h">${esc(g.hora)}</span>` : ''}<div style="flex:1"><b>${esc(a.nome)}</b><div class="mu">${g.local ? esc(g.local) + ' · ' : ''}${a.programas.length} programas</div></div></div>
        ${feita ? `<div class="pill ${status(feita)[1]}" style="font-size:14px;padding:8px 14px">${feita.exportadoEm ? 'Sessão enviada para revisão' : 'Sessão registrada · envie à supervisão'}</div>${ab ? '' : `<button class="lnk" data-a="iniciar" data-id="${a.id}" style="display:block;margin-top:6px">Iniciar outra sessão</button>`}` : (ab && ab.aprendizId === a.id ? '' : `<button class="btn pri bloco" data-a="iniciar" data-id="${a.id}"${ab ? ' disabled style="opacity:.5"' : ''}>Iniciar sessão</button>`)}</div>`;
    }).join('');
    const rec = pk.recados || [];
    h += `<div class="rot" style="margin:22px 0 10px">Recados da supervisão</div>` + (rec.length ? rec.slice(0, 8).map(r => `<div class="recado"><b>${esc(r.titulo)}</b><p>${esc(r.texto || '(sem comentário)')}</p></div>`).join('') : '<div class="mu" style="margin-bottom:12px">Nenhum recado por enquanto.</div>');
    h += `<div style="display:flex;gap:8px;margin-top:18px"><button class="btn bloco" data-a="abrir-pacote">Atualizar pacote</button>${pend ? `<button class="btn pri bloco" data-a="enviar">Enviar ${pend}</button>` : ''}</div>`;
    return h;
  }

  /* ---------- Sessões ---------- */
  function telaSessoes() {
    const pend = pendentes().length;
    let h = `<div class="cab"><div class="tx"><h1>Sessões</h1></div><span class="sync${pend ? ' pend' : ''}"><i></i>${pend ? pend + ' para enviar' : 'Sincronizado'}</span></div>`;
    if (pend) h += `<button class="btn pri bloco" data-a="enviar" style="margin-bottom:14px">Enviar ${pend} sessão(ões) à supervisão</button>`;
    const l = S.sessoes.slice().sort((a, b) => (b.data + b.inicio).localeCompare(a.data + a.inicio));
    h += l.map(s => { const st = status(s); const m = media(s); return `<button class="card" style="display:block;width:100%;text-align:left" data-a="${s.estado === 'finalizada' ? 'ver' : 'continuar'}" data-s="${s.id}"><div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b style="font-size:16px">${esc((apr(s.aprendizId) || {}).nome || 'Aprendiz')}</b><div class="mu"><span class="mono">${dm(s.data)}</span> · <span class="mono">${s.duracaoMin || 0} min</span>${m != null ? ' · <span class="mono">' + m + '%</span> independente' : ''}</div></div><span class="pill ${st[1]}">${st[0]}</span></div></button>`; }).join('') || '<div class="vazio">Nenhuma sessão registrada.</div>';
    if (l.some(s => s.estado === 'finalizada')) h += `<button class="lnk" data-a="reenviar" style="margin-top:6px">Reenviar todas as sessões</button>`;
    return h;
  }

  /* ---------- Formação ---------- */
  function telaFormacao() {
    const fs = (P() && P().formacoes) || [];
    let h = `<div class="cab"><div class="tx"><h1>Formação</h1><div class="mu">Módulos atribuídos pela supervisão</div></div></div>`;
    h += fs.map(f => { const feitas = S.formacoes[f.id] || f.concluidas || []; const pct = f.aulas.length ? Math.round(feitas.length / f.aulas.length * 100) : 0; const prox = f.aulas.find(a => !feitas.includes(a.id));
      return `<div class="card"><b style="font-size:17px">${esc(f.nome)}</b><div class="mu">${esc(f.carga || '')}${f.carga ? ' · ' : ''}${f.aulas.length} aula(s)</div><div style="display:flex;gap:10px;align-items:center;margin:12px 0"><div class="barra" style="flex:1"><i style="width:${pct}%"></i></div><b class="mono">${pct}%</b></div>
        ${prox ? `<button class="btn pri bloco" data-a="aula" data-f="${f.id}" data-au="${prox.id}">${feitas.length ? 'Continuar aula' : 'Começar aula'}: ${esc(prox.titulo)}</button>` : '<span class="pill st-revisada" style="font-size:14px;padding:8px 14px">Concluído · certificado disponível</span>'}</div>`; }).join('') || '<div class="vazio">Nenhum módulo atribuído.</div>';

  }
  function folhaAula(f, a) {
    return `<div class="rot">${esc(f.nome)}</div><h2 style="margin:6px 0 10px">${esc(a.titulo)}</h2>${a.link ? `<a class="btn bloco" href="${esc(a.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--tx);margin-bottom:10px">Abrir aula</a>` : '<p class="mu">Estude o material indicado pela supervisão.</p>'}<button class="btn pri bloco" data-a="concluir-aula" data-f="${f.id}" data-au="${a.id}">Marcar aula como concluída</button><button class="lnk" data-a="fechar" style="margin-top:8px">Voltar</button>`;
  }

  /* ---------- Coleta ---------- */
  function progsDe(s) { const a = apr(s.aprendizId); return a ? a.programas : []; }
  function reg(s, prog) { return s.resultados[prog.id] || (s.resultados[prog.id] = { fase: prog.fase, tentativas: [] }); }
  function seqHTML(t) { return `<div class="seq">${t.slice(-14).map(x => `<span style="background:var(--${x.r})">${SIG[x.r]}</span>`).join('') || '<span class="mu" style="color:var(--mu2);background:none;padding:0">Nenhuma tentativa ainda</span>'}</div>`; }
  function telaColeta(s) {
    const a = apr(s.aprendizId); const progs = progsDe(s); if (!progs.length) return `<div class="vazio">Nenhum programa ativo para este aprendiz.</div>`;
    const lista = P().config && P().config.fluxoColeta === 'lista';
    const nComp = Object.values(s.comportamentos).reduce((x, y) => x + y, 0);
    let h = `<div class="col"><div class="col-cab"><button class="btn" data-a="encerrar">Encerrar</button><div class="nome">${esc(a.nome)}<small id="crono">${mmss((Date.now() - s.t0) / 1000)}</small></div><button class="btn" data-a="folha" data-f="comp">Comport. ${nComp}</button></div>`;
    if (lista) {
      h += `<div class="lista-c">${progs.map(x => { const r = resumo(reg(s, x).tentativas); return `<div class="lc"><div class="top"><b>${esc(x.nome)}</b><span class="mono">${r.pct != null ? r.pct + '%' : '—'}</span></div><div class="mu">${esc(x.alvo || '')} · ${FASE[x.fase] || ''} · ${r.n} tent.</div>
        <div class="mini${tres() ? ' tres' : ''}">${(tres() ? ['I', 'A', 'E'] : ['I', 'G', 'V', 'FP', 'FT', 'E']).map(k => `<button style="background:var(--${k})" data-a="t" data-p="${x.id}" data-r="${k}">${k}</button>`).join('')}</div>${seqHTML(reg(s, x).tentativas).replace('class="seq"', 'class="seq" style="margin-top:10px"')}</div>`; }).join('')}</div>
        <div class="polegar"><div class="linha3"><button data-a="desfazer">Desfazer</button><button data-a="encerrar" style="background:var(--ac);color:#fff;border-color:var(--ac)">Encerrar</button></div></div></div>`;
      return h;
    }
    const i = Math.min(ui.prog, progs.length - 1); const x = progs[i]; const rr = reg(s, x); const r = resumo(rr.tentativas);
    h += `<div class="chips">${progs.map((y, j) => { const z = resumo(reg(s, y).tentativas); return `<button class="chip${j === i ? ' on' : ''}" data-a="prog" data-i="${j}">${esc(y.nome)}<span class="mono">${z.pct != null ? z.pct + '%' : '–'} · ${z.n}</span></button>`; }).join('')}</div>`;
    h += `<div class="prog"><div class="meta"><span>${esc(x.area || '')}</span>·<span>${FASE[x.fase] || ''}</span><span style="margin-left:auto" class="mono">${i + 1} de ${progs.length}</span></div><h2>${esc(x.nome)}</h2><div class="alvo">Alvo: ${esc(x.alvo || '—')}</div>
      <div class="pct"><b>${r.pct != null ? r.pct + '%' : '—'}</b><span class="mu">independente · <span class="mono">${r.n}</span> tentativas</span></div>${seqHTML(rr.tentativas)}
      ${x.procedimento ? `<details style="margin-top:10px"><summary class="mu" style="cursor:pointer">Como aplicar</summary><p class="mu" style="white-space:pre-wrap">${esc(x.procedimento)}</p></details>` : ''}</div>`;
    const cont = k => r.c[k] || 0;
    h += `<div class="polegar"><div class="linha3"><button data-a="prog" data-i="${Math.max(0, i - 1)}">‹ Anterior</button><button data-a="desfazer">Desfazer</button><button data-a="prog" data-i="${Math.min(progs.length - 1, i + 1)}">Próximo ›</button></div>
      ${tres() ? `<button class="aj" style="background:var(--A);width:100%" data-a="t" data-p="${x.id}" data-r="A"><span>Com ajuda</span><span class="n">${cont('A')}</span></button>` : `<div class="grade2">${N5.map(d => `<button class="aj" style="background:var(--${d.k})" data-a="t" data-p="${x.id}" data-r="${d.k}"><span>${d.n}</span><span class="n">${cont(d.k)}</span></button>`).join('')}</div>`}
      <div class="final"><button style="background:var(--E)" data-a="t" data-p="${x.id}" data-r="E">Erro</button><button style="background:var(--I)" data-a="t" data-p="${x.id}" data-r="I">Independente</button></div></div></div>`;
    return h;
  }
  function folhaComp(s) {
    const l = (P().config && P().config.comportamentos) || ['Choro/birra', 'Fuga da tarefa', 'Agressão', 'Estereotipia'];
    return `<div class="rot">Comportamentos</div><h2 style="margin:6px 0 10px">Registro de frequência</h2>${l.map(n => `<div class="comp-l"><span>${esc(n)}</span><button data-a="comp" data-n="${esc(n)}" data-d="-1" aria-label="Diminuir">−</button><b>${s.comportamentos[n] || 0}</b><button data-a="comp" data-n="${esc(n)}" data-d="1" aria-label="Aumentar">+</button></div>`).join('')}<button class="btn pri bloco" data-a="fechar" style="margin-top:12px">Pronto</button>`;
  }

  /* ---------- Resumo ---------- */
  let grav = null;
  function gravador(s) {
    if (!grav || grav._sid !== s.id) { grav = window.GRAV.criar((c, soT) => { const el = document.getElementById('grav-box'); if (!el) return; if (soT) { const t = el.querySelector('.grav-tempo'); if (t) t.textContent = mmss(c.seg); } else el.innerHTML = window.GRAV.html(c, 'g', 3); }); grav._sid = s.id; }
    return grav;
  }
  function telaResumo(s) {
    const a = apr(s.aprendizId); const progs = progsDe(s); const g = gravador(s);
    const ev = s.evolucao || (s.evolucao = { secoes: SEC_AT.map(x => ({ titulo: x.titulo, texto: '' })), transcricao: [], duracaoSeg: 0 });
    let h = `<div class="cab"><div class="tx"><div class="rot">Resumo da sessão</div><h1 style="font-size:24px">${esc(a.nome)}</h1><div class="mu"><span class="mono">${dm(s.data)} · ${s.inicio}–${hora()}</span></div></div></div>`;
    h += `<div class="card">${legenda()}${progs.map(x => { const r = resumo((s.resultados[x.id] || { tentativas: [] }).tentativas); return `<div class="res"><div class="t"><b>${esc(x.nome)}</b><span class="mono">${r.pct != null ? r.pct + '%' : '—'}</span><span class="mu mono">${r.n} tent.</span></div>${empil(r.c, r.n)}</div>`; }).join('')}</div>`;
    const comps = Object.entries(s.comportamentos).filter(([, v]) => v);
    h += `<div class="card"><div class="rot" style="margin-bottom:8px">Comportamentos</div>${comps.length ? comps.map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(k)}</span><b class="mono">${v}</b></div>`).join('') : '<div class="mu">Nenhum registrado.</div>'}</div>`;
    h += `<div class="card"><div class="rot" style="margin-bottom:8px">Evolução diária · prontuário</div><div id="grav-box">${window.GRAV.html(g, 'g', 3)}</div>
      ${g.linhas.length ? '<button class="btn peq" data-a="organizar" style="margin-top:10px">Organizar a transcrição nas seções</button>' : ''}
      ${ev.secoes.map((x, i) => `<label class="cp">${esc(x.titulo)}</label><textarea data-sec="${i}">${esc(x.texto)}</textarea>`).join('')}
      <label class="cp">Observações rápidas</label><input type="text" data-b="observacao" value="${esc(s.observacao || '')}" placeholder="Algo para a supervisão saber"></div>`;
    h += `<div style="display:flex;gap:8px"><button class="btn bloco" data-a="voltar-coleta">Voltar à coleta</button><button class="btn pri bloco" data-a="enviar-sessao">Enviar e gerar relatório</button></div>`;
    return h;
  }

  /* ---------- Relatório ---------- */
  function telaRelatorio(s) {
    const a = apr(s.aprendizId) || { nome: 'Aprendiz' }; const progs = progsDe(s); const st = status(s); const rem = statusRemoto(s); const m = media(s);
    const nomeProg = id => (progs.find(x => x.id === id) || { nome: '(programa)' }).nome;
    const ev = s.evolucao || { secoes: [] };
    let h = `<div class="cab nao-imp"><button class="btn peq" data-a="ir" data-h="sessoes">‹ Voltar</button><span style="flex:1"></span><button class="btn peq pri" data-a="pdf">Compartilhar PDF</button></div>
      <div class="doc"><div style="display:flex;justify-content:space-between;align-items:center"><b>Entre Sessões</b><span class="pill ${st[1]}">${st[0]}</span></div>
      <h2 style="font-size:22px;margin:14px 0 4px">${esc(a.nome)}</h2><div class="mu">Relatório da sessão</div>
      <div style="margin-top:12px"><div class="lin"><span>Data</span><b class="mono">${dm(s.data)}/${s.data.slice(0, 4)}</b></div><div class="lin"><span>Duração</span><b class="mono">${s.duracaoMin || 0} min</b></div><div class="lin"><span>Independência média</span><b class="mono">${m != null ? m + '%' : '—'}</b></div><div class="lin"><span>Aplicador(a)</span><b>${esc(s.atNome)}</b></div></div>
      <div class="rot" style="margin:18px 0 6px">Programas</div>${legenda()}${Object.keys(s.resultados).filter(id => s.resultados[id].tentativas.length).map(id => { const r = resumo(s.resultados[id].tentativas); return `<div class="res"><div class="t"><b>${esc(nomeProg(id))}</b><span class="mono">${r.pct}%</span><span class="mu mono">${r.n} tent.</span></div>${empil(r.c, r.n)}</div>`; }).join('') || '<div class="mu">Sem tentativas.</div>'}
      ${Object.entries(s.comportamentos).filter(([, v]) => v).length ? `<div class="rot" style="margin:18px 0 6px">Comportamentos</div>${Object.entries(s.comportamentos).filter(([, v]) => v).map(([k, v]) => `<div class="lin"><span>${esc(k)}</span><b class="mono">${v}</b></div>`).join('')}` : ''}
      <div class="rot" style="margin:18px 0 6px">Evolução diária${ev.duracaoSeg ? ' · áudio transcrito ' + mmss(ev.duracaoSeg) : ''}</div>${ev.secoes.filter(x => x.texto).map(x => `<p style="margin:6px 0"><b>${esc(x.titulo)}:</b> ${esc(x.texto)}</p>`).join('') || '<div class="mu">Sem evolução.</div>'}
      ${s.observacao ? `<div class="rot" style="margin:18px 0 6px">Observação do AT</div><p style="margin:0">${esc(s.observacao)}</p>` : ''}
      ${rem && rem.devolutiva ? `<div class="recado" style="margin-top:16px"><b>Devolutiva da supervisão</b><p>${esc(rem.devolutiva)}</p></div>` : ''}</div>
      ${rem && rem.status === 'ajuste' ? `<button class="btn pri bloco nao-imp" data-a="corrigir" data-s="${s.id}" style="margin-top:12px">Corrigir e reenviar</button>` : ''}`;
    return h;
  }

  /* ---------- render ---------- */
  let timer = null;
  function render() {
    clearInterval(timer); extra.innerHTML = '';
    const r = rota(); let h = '', nav = true;
    if (r[0] === 's' && sessao(r[1])) {
      const s = sessao(r[1]);
      if (s.estado === 'coleta') { h = telaColeta(s); nav = false; timer = setInterval(() => { const el = document.getElementById('crono'); if (el) el.textContent = mmss((Date.now() - s.t0) / 1000); }, 1000); }
      else if (s.estado === 'resumo') { h = telaResumo(s); nav = false; }
      else h = telaRelatorio(s);
    } else if (r[0] === 'sessoes') { ui.aba = 'sessoes'; h = telaSessoes(); }
    else if (r[0] === 'formacao') { ui.aba = 'formacao'; h = telaFormacao(); }
    else { ui.aba = 'hoje'; h = telaHoje(); }
    const coleta = r[0] === 's' && sessao(r[1]) && sessao(r[1]).estado === 'coleta';
    app.style.padding = coleta ? '0' : ''; app.style.maxWidth = coleta ? '560px' : '';
    app.innerHTML = h;
    if (nav) extra.innerHTML = `<nav class="nav nao-imp"><div class="in">${[['hoje', 'Hoje'], ['sessoes', 'Sessões'], ['formacao', 'Formação']].map(([k, t]) => `<button class="${ui.aba === k && r[0] !== 's' ? 'on' : ''}" data-a="ir" data-h="${k === 'hoje' ? '' : k}">${t}</button>`).join('')}</div></nav>`;
    if (ui.folha) { const f = document.createElement('div'); f.className = 'folha-f'; f.innerHTML = `<div class="folha">${ui.folha}</div>`; f.addEventListener('click', e => { if (e.target === f) { ui.folha = null; render(); } }); extra.appendChild(f); }
  }

  /* ---------- envio por arquivo ---------- */
  function exportar(lista) {
    if (!lista.length) { toast('Nenhuma sessão para enviar.'); return; }
    const agora = new Date().toISOString(); const pk = P();
    const arq = { tipo: 'es-registros-at', versao: 3, geradoEm: agora, atId: pk.at.id, atNome: pk.at.nome, sessoes: lista.map(s => { const c = Object.assign({}, s); delete c.estado; delete c.t0; delete c.pilha; return c; }), formacoes: S.formacoes };
    const nome = `registros_${pk.at.nome.split(' ')[0].normalize('NFD').replace(/[^A-Za-z0-9]/g, '')}_${hoje()}_${p2(new Date().getHours())}h${p2(new Date().getMinutes())}.json`;
    const blob = new Blob([JSON.stringify(arq)], { type: 'application/json' });
    const marcar = () => { lista.forEach(s => { s.exportadoEm = agora; }); salvar(); toast(`${lista.length} sessão(ões) enviada(s) para revisão.`); render(); };
    try {
      const f = new File([blob], nome, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Registros de sessão' }).then(marcar).catch(e => { if (!e || e.name !== 'AbortError') baixar(); }); return; }
    } catch (e) {}
    baixar(); function baixar() { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); marcar(); }
  }

  /* ---------- ações ---------- */
  const sAtual = () => { const r = rota(); return r[0] === 's' ? sessao(r[1]) : null; };
  const A = {
    ir: el => ir(el.dataset.h || ''),
    'abrir-pacote': () => document.getElementById('arq').click(),
    enviar: () => exportar(pendentes()),
    reenviar: () => { const l = S.sessoes.filter(s => s.estado === 'finalizada'); if (confirm(`Gerar um arquivo com todas as ${l.length} sessões?`)) exportar(l); },
    iniciar: el => { if (aberta()) return toast('Termine a sessão em andamento primeiro.'); const pk = P(); const s = { id: uid(), aprendizId: el.dataset.id, atId: pk.at.id, atNome: pk.at.nome, pacoteVersao: pk.geradoEm, data: hoje(), inicio: hora(), fim: '', t0: Date.now(), duracaoMin: 0, resultados: {}, comportamentos: {}, observacao: '', evolucao: null, niveis: tres() ? '3' : '5', pilha: [], estado: 'coleta', criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString(), exportadoEm: null }; S.sessoes.push(s); salvar(); ui.prog = 0; ir('s/' + s.id); },
    continuar: el => ir('s/' + el.dataset.s),
    prog: el => { ui.prog = +el.dataset.i; render(); },
    t: el => { const s = sAtual(); const x = progsDe(s).find(y => y.id === el.dataset.p); reg(s, x).tentativas.push({ r: el.dataset.r, t: Date.now() }); s.pilha.push(x.id); s.atualizadoEm = new Date().toISOString(); salvar(); vib(18); render(); },
    desfazer: () => { const s = sAtual(); const id = s.pilha.pop(); if (!id) return toast('Nada para desfazer.'); s.resultados[id].tentativas.pop(); salvar(); toast('Última tentativa desfeita.'); render(); },
    folha: () => { ui.folha = folhaComp(sAtual()); render(); },
    comp: el => { const s = sAtual(); const n = el.dataset.n; s.comportamentos[n] = Math.max(0, (s.comportamentos[n] || 0) + (+el.dataset.d)); salvar(); vib(15); ui.folha = folhaComp(s); render(); },
    fechar: () => { ui.folha = null; render(); },
    encerrar: () => { const s = sAtual(); s.estado = 'resumo'; s.fim = hora(); s.duracaoMin = Math.max(1, Math.round((Date.now() - s.t0) / 60000)); salvar(); render(); window.scrollTo(0, 0); },
    'voltar-coleta': () => { const s = sAtual(); guardarCampos(s); s.estado = 'coleta'; salvar(); render(); },
    'g-iniciar': () => gravador(sAtual()).iniciar(), 'g-pausar': () => gravador(sAtual()).pausar(), 'g-retomar': () => gravador(sAtual()).retomar(),
    'g-parar': () => { const s = sAtual(); guardarCampos(s); const g = gravador(s); g.parar(); s.evolucao.transcricao = g.linhas.slice(); s.evolucao.duracaoSeg = Math.round(g.seg); salvar(); render(); },
    'g-descartar': () => gravador(sAtual()).descartar(),
    organizar: () => { const s = sAtual(); const g = gravador(s); if (g.estado === 'gravando' || g.estado === 'pausado') g.parar(); s.evolucao.transcricao = g.linhas.slice(); s.evolucao.duracaoSeg = Math.round(g.seg); s.evolucao.secoes = window.GRAV.organizar(g.texto(), SEC_AT); salvar(); render(); },
    'enviar-sessao': () => {
      const s = sAtual(); guardarCampos(s); const g = gravador(s); if (g.estado === 'gravando' || g.estado === 'pausado') { g.parar(); s.evolucao.transcricao = g.linhas.slice(); s.evolucao.duracaoSeg = Math.round(g.seg); }
      s.estado = 'finalizada'; s.atualizadoEm = new Date().toISOString(); salvar(); grav = null;

    ver: el => ir('s/' + el.dataset.s),
    corrigir: el => { const s = sessao(el.dataset.s); s.estado = 'resumo'; s.t0 = s.t0 || Date.now(); salvar(); render(); },
    pdf: () => window.print(),
    aula: el => { const f = P().formacoes.find(x => x.id === el.dataset.f); const a = f.aulas.find(x => x.id === el.dataset.au); ui.folha = folhaAula(f, a); render(); },
    'concluir-aula': el => { const f = P().formacoes.find(x => x.id === el.dataset.f); const l = S.formacoes[f.id] || (S.formacoes[f.id] = (f.concluidas || []).slice()); if (!l.includes(el.dataset.au)) l.push(el.dataset.au); S.formacoesAtualizadoEm = new Date().toISOString(); salvar(); ui.folha = null; toast(l.length >= f.aulas.length ? 'Módulo concluído. Envie seus registros para a supervisão ver.' : 'Aula concluída.'); render(); },
  };
  function guardarCampos(s) { if (!s) return; document.querySelectorAll('[data-sec]').forEach(el => { s.evolucao.secoes[+el.dataset.sec].texto = el.value; }); const o = document.querySelector('[data-b="observacao"]'); if (o) s.observacao = o.value; s.atualizadoEm = new Date().toISOString(); salvar(); }
  document.addEventListener('click', e => { const el = e.target.closest('[data-a],[data-acao]'); if (!el) return; const f = A[el.dataset.a || el.dataset.acao]; if (f) { e.preventDefault(); f(el); } });
  document.addEventListener('input', e => { const s = sAtual(); if (!s) return; if (e.target.dataset.sec != null || e.target.dataset.b) guardarCampos(s); });
  document.getElementById('arq').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      try {
        const d = JSON.parse(txt);
        if (!d || d.tipo !== 'es-pacote-at' || !d.at || !Array.isArray(d.aprendizes)) throw new Error('Este arquivo não é um pacote do Entre Sessões. Peça à supervisão o pacote atualizado.');
        if (S.pacote && S.pacote.at.id !== d.at.id && !confirm(`Este pacote é de ${d.at.nome}, não de ${S.pacote.at.nome}. Substituir?`)) return;
        if (S.pacote && S.pacote.geradoEm > d.geradoEm && !confirm('Este pacote é mais antigo do que o atual. Substituir mesmo assim?')) return;
        S.pacote = d; (d.formacoes || []).forEach(fm => { const loc = S.formacoes[fm.id] || []; S.formacoes[fm.id] = [...new Set(loc.concat(fm.concluidas || []))]; }); salvar(); toast('Pacote atualizado.'); ir('');
      } catch (err) { alert(err.message || 'Arquivo inválido.'); }
    }).finally(() => { e.target.value = ''; });
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
})();
</script>
